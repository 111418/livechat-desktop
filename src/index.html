<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="./assets/css/tailwind.css"/>
    <link rel="stylesheet" href="./assets/css/pages/accueil.css"/>
    <script type="module" src="./assets/js/components/titlebar.ts"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Accueil - Splatt</title>
    <script type="module" src="./main.ts" defer></script>
</head>
<body>
<livechat-titlebar></livechat-titlebar>
<main>
    <header>
        <div class="header-banner p-4 border-b border-[rgba(var(--color-gray),0.2)] justify-between flex items-center">
            <div id="user" class="flex items-center gap-2">
                <div class="relative">
                    <div id="user-avatar"
                         class="rounded-full w-10 h-10 flex items-center justify-center bg-[rgb(var(--color-primary))] font-bold"></div>
                    <span class="w-2.5 h-2.5 rounded-full bg-green-500 absolute bottom-1 right-0"></span>
                </div>

                <div id="username">
                    <p class="font-black">illyes</p>
                    <p class="text-[rgb(var(--color-primary))] font-black">#1418</p>
                </div>
            </div>

            <div class="items-center flex gap-2">
                <div id="user-status"
                     class="relative border border-green-700 bg-[rgba(var(--color-green),0.18)] rounded-lg flex w-fit px-3 justify-center items-center gap-2 font-medium text-[rgb(var(--color-green))] py-0.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-[rgb(var(--color-green))]"></span>
                    <div> Connecté</div>
                </div>


                <button class="button button-slim flex items-center w-fit gap-1.5 relative" data-count="2">
                    <img src="./assets/svg/icons/user-plus.svg" alt="test" class="w-5 h-3.8 pl-1">
                    <div> Demandes</div>
                </button>

                <button class="button button-slim-primary flex items-center w-fit gap-1.5 ">
                    <span class="align-middle">+</span>
                    <div> Ajouter un ami</div>
                </button>

                <button class="button button-slim flex items-center w-fit gap-1.5 ">
                    <img src="./assets/svg/icons/settings.svg" alt="settings" class="w-5 h-3.8">
                </button>
            </div>

        </div>
    </header>
</main>
</body>
</html>
