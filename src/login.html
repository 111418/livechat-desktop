<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./assets/css/tailwind.css" />
    <link rel="stylesheet" href="./assets/css/pages/login.css" />
    <script type="module" src="./assets/js/components/titlebar.ts"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - Splatt</title>
    <script type="module" src="./assets/js/pages/login.ts" defer></script>
</head>
  <body>
    <livechat-titlebar></livechat-titlebar>
      <main>
          <div class="presentation">
              <div class="icon">
                  <img src="/assets/svg/icons/server.svg" alt="server" />
              </div>
              <h1>Connexion au serveur</h1>
              <p>
                  Livechat est une application <strong>open-source</strong>. Si vous souhaitez l'utiliser, il faut un serveur, renseignez ci-joint l'URL de votre serveur Splatt.
              </p>
          </div>
          <div class="content">
              <div class="input-container">
                  <label for="server-url">URL du serveur</label>
                  <input type="text" id="server-url" placeholder="https://livechat.test.com" />
              </div>
              <div class="buttons">
                  <button id="test-btn" class="button button-secondary">Tester la connexion</button>
                  <button id="connect-btn" class="button button-primary">Continuer →</button>
              </div>
              <a href="https://github.com/Splatt-Dev/livechat" class="github-link">
                  Héberger le tien → github
              </a>
              <p id="login-status" hidden></p>
          </div>
          <p class="text-sm">
              Open-Source・github.com/111418/splatt
          </p>
      </main>
  </body>
</html>
