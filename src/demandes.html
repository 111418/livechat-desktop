<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="./assets/css/tailwind.css"/>
    <link rel="stylesheet" href="./assets/css/pages/demandes.css"/>
    <script type="module" src="./assets/js/components/titlebar.ts"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Demandes d'amis - Splatt</title>
    <script type="module" src="./assets/js/pages/demandes.ts" defer></script>
    <script type="module" src="./main.ts" defer></script>
</head>
<body>
<livechat-titlebar></livechat-titlebar>
<main>
    <div id="demandes-header" class="flex items-center gap-3 px-4 py-3.5">
