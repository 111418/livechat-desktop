<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="./assets/css/tailwind.css"/>
    <link rel="stylesheet" href="./assets/css/pages/envoyer.css"/>
    <script type="module" src="./assets/js/components/titlebar.ts"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Envoyer - Splatt</title>
    <script type="module" src="./assets/js/pages/envoyer.ts" defer></script>
    <script type="module" src="./main.ts" defer></script>
</head>
<body>
<livechat-titlebar></livechat-titlebar>
<main>
    <div id="send-body">
        <div id="send-main">
            <div id="send-header">
                <a href="./index.html" id="back-btn" title="Retour" aria-label="Retour">←</a>
                <span class="text-lg font-black">Envoyer un jumpscare</span>
            </div>

            <div id="recipients-section">
                <div class="send-label">Destinataires</div>
                <div id="recipients-chips"></div>
            </div>

            <div id="media-section">
                <span class="send-label">Média</span>
                <div id="media-panel"></div>
            </div>

            <div id="message-section">
                <div class="send-label">Message (optionnel)</div>
                <input type="text" id="message-input" class="message-input" placeholder="Un petit mot pour accompagner le jumpscare…" autocomplete="off" maxlength="200">
            </div>
        </div>

        <div id="send-sidebar">
            <div class="send-label">Réglages</div>

            <div class="settings-slider-block">
                <div class="settings-slider-head"><span>Durée</span><span class="settings-slider-value" id="duration-value">4,0 s</span></div>
                <input type="range" min="5" max="100" step="5" value="40" id="duration-slider" class="volume-slider">
                <label class="full-video-row" id="full-video-row" hidden>
                    <input type="checkbox" id="full-video-checkbox">
                    Envoyer la vidéo entière (ignore la durée)
                </label>
            </div>

            <div class="settings-slider-block">
                <div class="transparent-toggle-row">
                    <span class="send-position-title">Plein écran chez la cible</span>
                    <button type="button" class="send-toggle" id="send-transparent-toggle">
                        <span class="send-toggle-knob"></span>
                    </button>
                </div>
                <p class="transparent-hint" id="transparent-hint"></p>
                <p class="transparent-hint">La position et le volume sont réglés par chaque destinataire dans ses propres paramètres.</p>
            </div>

            <button type="button" id="send-jumpscare-submit" class="send-submit-btn" disabled>⚡ Envoyer le jumpscare</button>
            <span id="send-footer-text" class="send-footer-text"></span>
        </div>
    </div>
</main>
</body>
</html>
