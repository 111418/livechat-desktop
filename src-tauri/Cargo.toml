[package]
name = "livechat"
version = "0.2.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "livechat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon : nécessaire pour l'icône dans la zone de notification (fermer =
# masquer en arrière-plan au lieu de quitter, réglable dans les paramètres).
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"

# Le scheme splatt:// est géré nativement sur macOS (LaunchServices) mais sur
# Windows/Linux, cliquer un lien splatt:// relance un DEUXIEME process : ce
# plugin détecte l'instance déjà ouverte et lui transmet les arguments au lieu
# de laisser une seconde fenêtre s'ouvrir. Inutile/non supporté sur mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

# Sur Windows, meme sans set_focus(), afficher une fenetre peut l'activer et
# lui voler le focus clavier/souris (grave si l'app active est un jeu plein
# ecran) : WS_EX_NOACTIVATE l'en empeche durablement, au niveau du systeme.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
